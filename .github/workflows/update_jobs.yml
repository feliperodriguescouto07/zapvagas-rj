name: Atualização Automática de Vagas RJ

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run script to fetch jobs
        run: python fetch_jobs.py

      - name: Commit and push updated jobs.json
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add vagas.json
          git commit -m "Atualização automática diária das vagas" || echo "Sem mudanças para commitar"
          git push
