name: Atualização Automática de Vagas RJ

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Executar robô gerador de vagas RJ
        run: |
          python fetch_jobs.py

      - name: Salvar novo arquivo vagas.json no site
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add vagas.json
          git commit -m "bot: atualização diária de vagas RJ ($(date +'%d/%m/%Y'))" || exit 0
          git push
